          type: boolean
      - description: The id of the thing
        in: path
        name: id
        required: true
        schema:
          type: string
      - in: header
        name: X-Organization
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/thingUpdate'
          application/x-www-form-urlencoded:
